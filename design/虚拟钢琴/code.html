<style>
            .no-scrollbar::-webkit-scrollbar {
              display: none;
            }
            .no-scrollbar {
              -ms-overflow-style: none;
              scrollbar-width: none;
            }
            
            .white-key {
              width: 50px;
              height: 100%;
              background: linear-gradient(to bottom, #ffffff, #f0f1f2);
              border-radius: 0 0 6px 6px;
              position: relative;
              margin-right: 2px;
              box-shadow: inset 0 0 4px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.1);
              transition: background 0.1s, box-shadow 0.1s, transform 0.05s;
              cursor: pointer;
              display: flex;
              flex-direction: column;
              justify-content: flex-end;
              align-items: center;
              padding-bottom: 12px;
            }
            
            .white-key:active, .white-key.active {
              background: linear-gradient(to bottom, #e1e3e4, #c1c6d6);
              box-shadow: inset 0 2px 8px rgba(0,0,0,0.2), 0 1px 2px rgba(0,0,0,0.1);
              transform: translateY(2px);
            }
            
            .black-key {
              width: 32px;
              height: 60%;
              background: linear-gradient(to bottom, #2e3132, #000608);
              border-radius: 0 0 4px 4px;
              position: absolute;
              top: 0;
              z-index: 10;
              box-shadow: inset 0 0 4px rgba(255,255,255,0.2), 0 6px 8px rgba(0,0,0,0.4);
              transition: background 0.1s, box-shadow 0.1s, transform 0.05s;
              cursor: pointer;
              display: flex;
              flex-direction: column;
              justify-content: flex-end;
              align-items: center;
              padding-bottom: 16px;
            }
            
            .black-key:active, .black-key.active {
              background: linear-gradient(to bottom, #181c20, #000000);
              box-shadow: inset 0 2px 6px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.2);
              transform: translateY(2px);
            }
            
            .key-label {
              font-size: 12px;
              color: #727785;
              font-weight: 500;
              pointer-events: none;
              transition: opacity 0.2s;
            }
            .black-key .key-label {
              color: #adc7ff;
              opacity: 0.7;
            }
            .labels-hidden .key-label {
              opacity: 0;
            }
            
            @media (min-width: 768px) {
                .white-key { width: 60px; }
                .black-key { width: 38px; }
            }
          </style>
<script>
            // Expanded key range for landscape mode
            const baseKeys = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const octaves = [2, 3, 4, 5];
            const keysData = [];
            
            let currentOffset = 0;
            let isDesktop = window.innerWidth >= 768;
            const whiteKeyWidth = isDesktop ? 60 : 50;
            const blackKeyWidth = isDesktop ? 38 : 32;
            const margin = 2;
            
            octaves.forEach(octave => {
                baseKeys.forEach(note => {
                    const isBlack = note.includes('#');
                    const fullNote = note + octave;
                    
                    if (!isBlack) {
                        keysData.push({ note: fullNote, type: 'white', offset: currentOffset });
                        currentOffset += whiteKeyWidth + margin;
                    } else {
                        // Position black key between previous and next white key
                        const prevWhiteOffset = currentOffset - (whiteKeyWidth + margin);
                        const blackOffset = prevWhiteOffset + whiteKeyWidth - (blackKeyWidth / 2) + margin/2;
                        keysData.push({ note: fullNote, type: 'black', blackOffset: `${blackOffset}px` });
                    }
                });
            });
            // Add final C
            keysData.push({ note: 'C6', type: 'white', offset: currentOffset });

            const keyboardContainer = document.getElementById('piano-keyboard');

            keysData.forEach((key, index) => {
              const keyEl = document.createElement('div');
              
              if (key.type === 'white') {
                keyEl.className = 'white-key';
              } else {
                keyEl.className = 'black-key';
                keyEl.style.left = key.blackOffset;
              }
              
              keyEl.innerHTML = `<span class="key-label font-label-sm">${key.note}</span>`;
              
              keyEl.addEventListener('touchstart', (e) => { e.preventDefault(); keyEl.classList.add('active'); playNote(key.note); });
              keyEl.addEventListener('touchend', (e) => { e.preventDefault(); keyEl.classList.remove('active'); });
              keyEl.addEventListener('mousedown', () => { keyEl.classList.add('active'); playNote(key.note); });
              keyEl.addEventListener('mouseup', () => { keyEl.classList.remove('active'); });
              keyEl.addEventListener('mouseleave', () => { keyEl.classList.remove('active'); });

              keyboardContainer.appendChild(keyEl);
            });
            
            // Initial scroll position to center
            setTimeout(() => {
                const scrollContainer = document.getElementById('piano-scroll-container');
                if(scrollContainer) {
                    // Center roughly around middle C (C4)
                    const targetScroll = (scrollContainer.scrollWidth / 2) - (scrollContainer.clientWidth / 2);
                    scrollContainer.scrollLeft = targetScroll;
                }
            }, 100);

            function playNote(note) {
              console.log(`Playing note: ${note}`);
            }

            function toggleLabels(btn) {
              const keyboard = document.getElementById('piano-keyboard');
              keyboard.classList.toggle('labels-hidden');
              const isHidden = keyboard.classList.contains('labels-hidden');
              btn.style.backgroundColor = isHidden ? 'var(--color-surface-container-low)' : 'var(--color-primary-20)';
              btn.style.color = isHidden ? 'var(--color-on-surface-variant)' : 'var(--color-inverse-primary)';
            }

            function scrollPiano(amount) {
              const container = document.getElementById('piano-scroll-container');
              container.scrollBy({ left: amount, behavior: 'smooth' });
            }
            
            // Handle resize to update offsets if crossing breakpoint
            window.addEventListener('resize', () => {
                const newIsDesktop = window.innerWidth >= 768;
                if (newIsDesktop !== isDesktop) {
                    // Reload to redraw keys with correct offsets for simplicity in this demo
                    location.reload(); 
                }
            });
          </script>
